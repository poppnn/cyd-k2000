; CYD = ESP32-2432S028R (ILI9341 320x240) + micro I2S INMP441
[platformio]
default_envs = cyd

[env:cyd]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = bodmer/TFT_eSPI@2.5.43
build_flags =
  -Wall -Wextra
  -DUSER_SETUP_LOADED=1
  -DILI9341_2_DRIVER=1
  -DTFT_INVERSION_ON=1      ; dalle 2,8" à touch résistif : sans ça les couleurs sont inversées
  -DTFT_WIDTH=240 -DTFT_HEIGHT=320
  -DTFT_MISO=12 -DTFT_MOSI=13 -DTFT_SCLK=14
  -DTFT_CS=15 -DTFT_DC=2 -DTFT_RST=-1
  -DTFT_BL=21 -DTFT_BACKLIGHT_ON=HIGH
  -DUSE_HSPI_PORT=1
  -DLOAD_GLCD=1 -DLOAD_FONT2=1 -DLOAD_FONT4=1 -DLOAD_FONT7=1
  -DSPI_FREQUENCY=55000000

; tests du calcul dB sur PC : pio test -e native
[env:native]
platform = native
build_flags = -Wall -Wextra
